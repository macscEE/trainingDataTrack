<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <title>Gruppo Allenamento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0a7a5a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Allenamento">
  <style>
    :root {
      --bg: #fff;
      --fg: #1c1c1e;
      --mu: #6b6b70;
      --ac: #0a7a5a;
      --bd: #ddd;
      --cd: #f6f6f7
    }

    @media(prefers-color-scheme:dark) {
      :root {
        --bg: #17171a;
        --fg: #eee;
        --mu: #9a9aa0;
        --ac: #2fb98c;
        --bd: #333;
        --cd: #222226
      }
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.45 system-ui, -apple-system, sans-serif;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom)
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px
    }

    nav {
      display: flex;
      gap: 6px;
      margin-bottom: 12px
    }

    nav button {
      flex: 1
    }

    button,
    select,
    input,
    textarea {
      font: inherit;
      color: var(--fg);
      background: var(--cd);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 10px;
      box-sizing: border-box
    }

    button {
      cursor: pointer
    }

    button.on,
    button.pri {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac)
    }

    textarea {
      width: 100%;
      min-height: 220px
    }

    .card {
      background: var(--cd);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0
    }

    .row>* {
      flex: 1;
      min-width: 110px
    }

    h2 {
      font-size: 1.1rem;
      margin: .2rem 0 .5rem
    }

    .mu {
      color: var(--mu);
      font-size: .9rem
    }

    .scroll {
      overflow-x: auto
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: .9rem
    }

    td,
    th {
      border-bottom: 1px solid var(--bd);
      padding: 5px 6px;
      text-align: left
    }

    pre {
      white-space: pre-wrap;
      font: inherit;
      margin: 0
    }

    #ld {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .3);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9
    }

    #ld.on {
      display: flex
    }

    #ld i {
      width: 46px;
      height: 46px;
      border: 5px solid rgba(255, 255, 255, .4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: sp .8s linear infinite
    }

    @keyframes sp {
      to {
        transform: rotate(360deg)
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <p class="mu">Caricamento…</p>
  </main>
  <div id="ld"><i></i></div>

  <script type="module">
